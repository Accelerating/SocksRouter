name: Release APK

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0' 'ndk;28.2.13676358'

      - name: Restore release signing files
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_PROPERTIES_BASE64: ${{ secrets.ANDROID_SIGNING_PROPERTIES_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$SIGNING_PROPERTIES_BASE64" ]]; then
            echo '::error::Configure ANDROID_KEYSTORE_BASE64 and ANDROID_SIGNING_PROPERTIES_BASE64 repository secrets before releasing.'
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > socksrouter-release.keystore
          printf '%s' "$SIGNING_PROPERTIES_BASE64" | base64 --decode > release-signing.properties

      - name: Build release APK
        run: |
          ./gradlew --no-daemon :app:assembleRelease \
            -PreleaseVersionName="${GITHUB_REF_NAME#v}" \
            -PreleaseVersionCode="$((GITHUB_RUN_NUMBER + 1))"

      - name: Verify and prepare APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/SocksRouter-arm64-v8a.apk
          cd dist
          sha256sum SocksRouter-arm64-v8a.apk > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

      - name: Remove release signing files
        if: always()
        run: rm -f socksrouter-release.keystore release-signing.properties
